<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Product</title>
</head>
<body>
    <header>
        <div class="logo">
            <h3>Cheep-Shop</h3>
            <h5>Oportunidades e Salvados</h5>
        </div>

        <nav>
            <ul>
                <li><a href="#hero">Início</a></li>
                <li><a href="#list-products">Catálogo</a></li>
                <li><a href="#about-us">Quem somos</a></li>
                <li><a href="#contact">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="edit-product">
            <h2>Edição de Produto</h2>
            <form action="">
                <label for="">Nome do Produto:</label>
                <input type="text">

                <label for="">Descrição:</label>
                <textarea name="" id=""></textarea>

                <label for="">Quantidade:</label>
                <input type="number">

                <label for="">Preço real:</label>
                <input type="number" name="" id="">

                <label for="">Preço desconto:</label>
                <input type="number" name="" id="" step="0.01">

                <label for="">Selecione a imagem do Produto:</label>
                <input type="file" accept="image/*" name="" id="">

                <button type="submit" class="edit-product">Editar Produto</button>
            </form>
        </section>
    </main>
</body>
</html>
